[package]
name = "zephium-extension-repository"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
acquired-packages = ["dep:zephium-extension-acquisition"]
beta-packages = ["dep:zephium-extension-distribution"]
local-extension-lab-diagnostics = []

[dependencies]
serde.workspace = true
serde_json = "=1.0.150"
sha2 = "=0.10.9"
thiserror.workspace = true
zephium-core = { path = "../zephium-core", version = "=0.1.0" }
zephium-extension-authority = { path = "../zephium-extension-authority", version = "=0.1.0" }
zephium-extension-acquisition = { path = "../zephium-extension-acquisition", version = "=0.1.0", optional = true }
zephium-extension-package = { path = "../zephium-extension-package", version = "=0.1.0" }
zephium-extension-runtime-api = { path = "../zephium-extension-runtime-api", version = "=0.1.0" }
zephium-private-fs = { path = "../zephium-private-fs", version = "=0.1.0" }
zephium-extension-distribution = { path = "../zephium-extension-distribution", version = "=0.1.0", optional = true, default-features = false, features = ["beta-admission"] }

[dev-dependencies]
base64.workspace = true
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
ring.workspace = true
tempfile.workspace = true
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }

[lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = [
    "cfg(zephium_internal_repository_e2e)",
    "cfg(zephium_internal_acquired_repository_e2e)",
    "cfg(zephium_extension_product_measurement)",
] }
