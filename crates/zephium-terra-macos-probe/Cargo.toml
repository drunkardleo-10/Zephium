[package]
name = "zephium-terra-macos-probe"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = false

[features]
default = []
durable-runtime = ["live-probe", "zephium-work-composition/durable-runtime", "zephium-work-composition/retained-lifetime-diagnostic", "dep:zephium-agent-model-catalog"]
live-probe = [
    "dep:zephium-app",
    "zephium-agent-controller/probe-harness",
    "zephium-agent-provider-transport/probe-harness",
    "zephium-engine/native-agentic-semantic-probe",
    "zephium-work-composition/public-qualification",
    "zephium-work-composition/navigation-qualification",
]

[[bin]]
name = "macos-terra-agentic-probe"
path = "src/main.rs"
required-features = ["live-probe"]

[dependencies]
zephium-agent-model-catalog = { workspace = true, optional = true }
serde_json.workspace = true
zephium-ipc.workspace = true
zephium-agent-controller.workspace = true
zephium-agent-provider-transport.workspace = true
zephium-agentic.workspace = true
zephium-engine.workspace = true
zephium-agent-runtime.workspace = true
zephium-store.workspace = true
zephium-core.workspace = true
zephium-app = { workspace = true, optional = true }
zephium-work-composition.workspace = true
zephium-blocker = { workspace = true, features = ["webkit"] }
zephium-blocker-service.workspace = true
zephium-extension-service.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
