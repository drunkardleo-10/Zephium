[package]
name = "zephium-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Builds native, main-thread probe executables used only by platform CI. These
# binaries are excluded from ordinary desktop builds unless explicitly enabled.
native-isolation-probes = []
# Builds the local-origin WKWebView page-permission denial/deferral probe. It
# never resolves native Allow or grants device authority.
native-page-permission-probes = []
# Builds the macOS 15.4+ WKWebExtension behavioral and lifecycle probe. This
# remains separate from native-isolation-probes so ordinary builds do not carry
# the probe fixture, delegate graph, HTTP harness, or diagnostic surfaces.
native-web-extension-probes = [
    "dep:tempfile",
    "dep:sha2",
    "dep:serde",
    "objc2-web-kit/WKWebExtension",
    "objc2-web-kit/WKWebExtensionAction",
    "objc2-web-kit/WKWebExtensionContext",
    "objc2-web-kit/WKWebExtensionController",
    "objc2-web-kit/WKWebExtensionControllerConfiguration",
    "objc2-web-kit/WKWebExtensionDataRecord",
    "objc2-web-kit/WKWebExtensionDataType",
    "objc2-web-kit/WKWebExtensionMatchPattern",
    "objc2-web-kit/WKWebExtensionMessagePort",
    "objc2-web-kit/WKWebExtensionPermission",
    "objc2-web-kit/WKHTTPCookieStore",
    "objc2-web-kit/WKURLSchemeHandler",
    "objc2-web-kit/WKURLSchemeTask",
]
# Adds only redacted native-adapter phase diagnostics consumed by the separate
# authenticated product-path probe. Ordinary engine and desktop builds do not
# compile these diagnostics.
native-extension-product-probes = []
# Enables inspectable native extension contexts and content views only in the
# separately identified private browser lab. Popovers remain transient unless
# the explicit inspector-retention environment switch is set. Shipping
# contexts and content remain non-inspectable and transient.
native-extension-lab-diagnostics = []
# Compiles the intentionally non-product Windows CDP feasibility harness. The
# default product must not contain this path until Phase 0a's live gates pass.
windows-cdp-spike = []
# Builds the non-shipping macOS native-input/isTrusted risk probe. Its fixture
# dependency independently refuses optimized builds, and the engine repeats
# that refusal at its own boundary below.
native-agentic-input-probe = [
    "dep:serde",
    "dep:tempfile",
    "dep:windows-probe-sys",
    "dep:zephium-agentic",
    "zephium-agentic/probe-harness",
]
# Builds the non-shipping platform production semantic-runtime qualifiers.
# They reuse the production agent-context adapters but add only fixed loopback
# fixtures and content-free pass/fail runners. The raw Windows bindings remain
# target-specific and support only the Windows resource evidence path.
native-agentic-semantic-probe = [
    "agentic-browser",
    "dep:tempfile",
    "dep:windows-probe-sys",
    "zephium-agentic/probe-harness",
]
# Actual desktop-lifecycle evidence only; never a product rendering capability.
native-agentic-foreground-probe = ["native-agentic-semantic-probe"]
# Compiles the production, zero-idle agent-browser native port. The feature is
# intentionally separate from the release-excluded probe vocabulary.
agentic-browser = ["dep:zephium-agentic", "dep:zeroize"]

[[bin]]
name = "macos-principal-isolation-probe"
path = "src/bin/macos_principal_isolation_probe.rs"
required-features = ["native-isolation-probes"]

[[bin]]
name = "macos-page-permission-probe"
path = "src/bin/macos_page_permission_probe.rs"
required-features = ["native-page-permission-probes"]

[[bin]]
name = "macos-web-extension-probe"
path = "src/bin/macos_web_extension_probe.rs"
required-features = ["native-web-extension-probes"]

[[bin]]
name = "macos-bitwarden-core-probe"
path = "src/bin/macos_bitwarden_core_probe.rs"
required-features = ["native-web-extension-probes"]

[[bin]]
name = "macos-stock-password-manager-probe"
path = "src/bin/macos_stock_password_manager_probe.rs"
required-features = ["native-web-extension-probes"]

[[bin]]
name = "macos-web-extension-resource-probe"
path = "src/bin/macos_web_extension_resource_probe.rs"
required-features = ["native-web-extension-probes"]

[[bin]]
name = "macos-extension-compatibility-probe"
path = "src/bin/macos_extension_compatibility_probe.rs"
required-features = ["native-web-extension-probes"]

[[bin]]
name = "macos-vimium-probe"
path = "src/bin/macos_vimium_probe.rs"
required-features = ["native-web-extension-probes"]

[[bin]]
name = "macos-agentic-input-probe"
path = "src/bin/macos_agentic_input_probe.rs"
required-features = ["native-agentic-input-probe"]

[[bin]]
name = "windows-agentic-input-probe"
path = "src/bin/windows_agentic_input_probe.rs"
required-features = ["native-agentic-input-probe"]

[[bin]]
name = "macos-agentic-semantic-probe"
path = "src/bin/macos_agentic_semantic_probe.rs"
required-features = ["native-agentic-semantic-probe"]

[[bin]]
name = "windows-agentic-semantic-probe"
path = "src/bin/windows_agentic_semantic_probe.rs"
required-features = ["native-agentic-semantic-probe"]

[[bin]]
name = "macos-representative-extension-probe"
path = "src/bin/macos_representative_extension_probe.rs"
required-features = ["native-web-extension-probes"]

[dependencies]
zephium-agentic = { workspace = true, optional = true }
zephium-core.workspace = true
zephium-extension-runtime-api.workspace = true
wry.workspace = true
serde_json.workspace = true
serde = { workspace = true, optional = true }
sha2 = { version = "=0.10.9", optional = true }
tempfile = { workspace = true, optional = true }
url.workspace = true
zeroize = { version = "=1.9.0", optional = true }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle.workspace = true
webview2-com = "0.38"
windows = { version = "0.61", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows-probe-sys = { package = "windows-sys", version = "=0.61.2", optional = true, features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
windows-core = "0.61"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
gtk = "0.18"
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = { version = "0.3.1", default-features = false, features = ["block2", "std"] }
libc = "0.2"
objc2 = "0.6"
objc2-authentication-services = { version = "=0.3.2", default-features = false, features = [
    "ASAuthorizationWebBrowserPublicKeyCredentialManager",
    "block2",
] }
objc2-app-kit = "0.3"
objc2-core-foundation = { version = "0.3", features = ["CFString", "CFURL"] }
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"
objc2-security = { version = "0.3", default-features = false, features = [
    "CSCommon",
    "SecRequirement",
    "SecStaticCode",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "block2",
    "objc2-app-kit",
    "WKContentWorld",
    "WKContentRuleList",
    "WKContentRuleListStore",
    "WKError",
    "WKNavigationAction",
    "WKNavigationDelegate",
    "WKPreferences",
    "WKFrameInfo",
    "WKScriptMessage",
    "WKScriptMessageHandlerWithReply",
    "WKSnapshotConfiguration",
    "WKUserContentController",
    "WKUserScript",
    "WKWebExtension",
    "WKWebExtensionAction",
    "WKWebExtensionCommand",
    "WKWebExtensionContext",
    "WKWebExtensionController",
    "WKWebExtensionControllerConfiguration",
    "WKWebExtensionControllerDelegate",
    "WKWebExtensionDataRecord",
    "WKWebExtensionDataType",
    "WKWebExtensionMatchPattern",
    "WKWebExtensionMessagePort",
    "WKWebExtensionPermission",
    "WKWebExtensionTab",
    "WKWebExtensionTabConfiguration",
    "WKWebExtensionWindow",
    "WKWebView",
    "WKWebViewConfiguration",
    "WKWebsiteDataRecord",
    "WKWebsiteDataStore",
] }
objc2-quartz-core = "0.3"
raw-window-handle.workspace = true
zephium-extension-package = { path = "../zephium-extension-package", version = "=0.1.0" }
