[package]
name = "zephium-extension-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
acquired-packages = [
    "dep:zephium-extension-package",
    "zephium-extension-repository/acquired-packages",
]
# Non-shipping projection policy for the separately identified private lab.
# It keeps exact upstream provenance but never labels a local candidate as a
# Zephium-reviewed release package.
local-extension-lab = [
    "acquired-packages",
    "zephium-extension-repository/local-extension-lab-diagnostics",
]

[dependencies]
zephium-core.workspace = true
zephium-extension-authority.workspace = true
zephium-extension-package = { path = "../zephium-extension-package", version = "=0.1.0", optional = true }
zephium-extension-repository.workspace = true
zephium-extension-runtime-api.workspace = true
zephium-private-fs.workspace = true
zephium-store.workspace = true

[dev-dependencies]
base64.workspace = true
ring.workspace = true
sha2 = "=0.10.9"
tempfile.workspace = true
zephium-extension-package = { path = "../zephium-extension-package", version = "=0.1.0" }

[lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = [
    "cfg(zephium_internal_repository_e2e)",
    "cfg(zephium_internal_acquired_repository_e2e)",
] }
