[package]
name = "zephium-agent-provider-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
futures-util = { version = "=0.3.32", default-features = false, features = ["std"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["http2", "rustls", "stream", "system-proxy"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
zeroize = "=1.9.0"
zephium-agentic.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"
security-framework-sys = "=2.17.0"

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }
zephium-core.workspace = true
