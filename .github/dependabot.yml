version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    # The adblock security fork is excluded and owns its reviewed lock graph.
    directory: /vendor/adblock
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    # The sanitizer harness is an independent, explicitly pinned test graph.
    directory: /crates/zephium-blocker/fuzz
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    # Wry is excluded from the root workspace and owns an independent lockfile.
    directory: /vendor/wry
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    # Tauri's policy fork is excluded and owns an independent validation graph.
    directory: /vendor/tauri
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    # The runtime adapter is independently locked and validated on every OS.
    directory: /vendor/tauri-runtime-wry
    schedule:
      interval: weekly
  - package-ecosystem: npm
    # pnpm-lock.yaml is owned by the repository-root workspace and covers
    # both frame/ and desktop/. Updating only /frame would miss the Tauri CLI
    # and can leave Dependabot without the authoritative lockfile boundary.
    directory: /
    schedule:
      interval: weekly
