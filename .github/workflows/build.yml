name: Test build

on:
  workflow_dispatch:

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
          - platform: windows-latest
            bundles: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/msi/*.msi

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      # The gstreamer set must be complete: linuxdeploy always drags the
      # gstreamer core in as a webkit dependency, and a core without plugins
      # shadows the host stack and crashes the web process on any media page
      # (autoaudiosink not found). bundleMediaFramework packs the full stack.
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav \
            gstreamer1.0-gl \
            gstreamer1.0-alsa \
            gstreamer1.0-pulseaudio

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          key: bundle-${{ matrix.platform }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bundles
        run: pnpm --dir desktop run build

      # The Ubuntu 22.04 host bundles libwayland 1.20 into the AppImage, which
      # shadows the host copy and breaks EGL on recent Mesa (Arch, Fedora).
      # Same proven fix as Terax, minus updater re-signing.
      - name: Fix AppImage wayland libs
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          APPIMAGE=$(ls target/release/bundle/appimage/*.AppImage | head -n1)
          BASENAME=$(basename "$APPIMAGE")
          WORK=$(mktemp -d)
          cp "$APPIMAGE" "$WORK/"
          pushd "$WORK" >/dev/null
          chmod +x "./$BASENAME"
          "./$BASENAME" --appimage-extract >/dev/null
          for lib in libwayland-client.so.0 libwayland-egl.so.1 libwayland-cursor.so.0; do
            test -e "squashfs-root/usr/lib/$lib" \
              || { echo "expected bundled lib missing: $lib (layout changed?)"; exit 1; }
          done
          rm -f squashfs-root/usr/lib/libwayland-client.so.0 \
                squashfs-root/usr/lib/libwayland-egl.so.1 \
                squashfs-root/usr/lib/libwayland-cursor.so.0 \
                squashfs-root/usr/lib/libwayland-server.so.0
          curl -fsSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run squashfs-root "$BASENAME"
          popd >/dev/null
          cp "$WORK/$BASENAME" "$APPIMAGE"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zephium-${{ matrix.platform }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
