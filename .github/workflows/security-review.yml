name: Security review

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-review
  cancel-in-progress: true

jobs:
  review:
    name: Review deadlines
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - run: cargo build --locked -p xtask

      - name: Check engine floors and advisory exceptions
        id: check
        run: |
          failed=0
          cargo xtask check-engine-floors --strict 2>&1 | tee -a "${RUNNER_TEMP}/review.log" || failed=1
          cargo xtask check-advisory-exceptions --strict 2>&1 | tee -a "${RUNNER_TEMP}/review.log" || failed=1
          echo "failed=${failed}" >> "${GITHUB_OUTPUT}"

      - name: Open or update the review issue
        if: steps.check.outputs.failed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Engine security review due
        run: |
          {
            echo "The weekly security review found expired deadlines:"
            echo
            sed -nE 's/^::error title=([^:]*)::/- **\1:** /p' "${RUNNER_TEMP}/review.log"
            echo
            echo "Follow docs/security-maintenance.md, then close this issue."
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "${RUNNER_TEMP}/issue.md"
          number="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "\"${TITLE}\" in:title" \
            --json number,title --jq "map(select(.title == env.TITLE)) | first | .number // empty")"
          if [[ -n "${number}" ]]; then
            gh issue comment "${number}" --repo "${GITHUB_REPOSITORY}" --body-file "${RUNNER_TEMP}/issue.md"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --body-file "${RUNNER_TEMP}/issue.md"
          fi
          exit 1
