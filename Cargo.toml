[workspace]
resolver = "2"
members = ["crates/*", "desktop", "xtask"]
exclude = ["vendor/wry"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
authors = ["crynta"]
repository = "https://github.com/zephium/zephium"

[workspace.dependencies]
zephium-core = { path = "crates/zephium-core" }
zephium-ipc = { path = "crates/zephium-ipc" }
zephium-engine = { path = "crates/zephium-engine" }
zephium-net = { path = "crates/zephium-net" }
zephium-store = { path = "crates/zephium-store" }
zephium-app = { path = "crates/zephium-app" }

tauri = { version = "2", features = ["macos-private-api", "devtools"] }
tauri-build = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
wry = "0.55"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ulid = "1"
ureq = "2"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
proptest = "1"
tempfile = "3"
