[package]
name = "zephium-desktop"
default-run = "zephium-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Isolated actual-product file workflow verification, never a shipping app.
file-workflows-qa = ["tauri/custom-protocol"]
# Isolated user-resource UI verification; never a shipping application.
resource-ui-qa = ["tauri/custom-protocol"]
# The extension runtime in an isolated, bundled QA application.
webext-qa = ["tauri/custom-protocol"]
# Same release-excluded retained path, one closed real-public product-brief task.
macos-work-retained-public-probe = [
    "macos-work-retained-controller-probe",
    "zephium-work-composition/retained-public-qualification",
]
# One explicit paid public-fixture controller witness in the isolated debug app.
macos-work-retained-controller-probe = [
    "macos-work-rendering-probe",
    "dep:zephium-work-composition",
    "zephium-work-composition/retained-qualification",
]
# Same isolated actual-application bundle, selected only at compile time.
macos-work-resource-probe = [
    "macos-work-rendering-probe",
    "zephium-engine/native-agentic-work-resource-probe",
]
# Provider-free actual-application rendering witness; never optimized or ordinary Browse.
macos-work-rendering-probe = [
    "zephium-engine/native-agentic-foreground-probe",
    "tauri/custom-protocol",
]
# Explicit, non-UI Work composition. Default desktop remains unchanged.
macos-work = ["dep:zephium-work-composition", "zephium-work-composition/macos-work"]
# Explicit release-gate forwarding only. Default product builds remain
# deny-only until the packaged WKWebView/TCC gate is recorded as passing.
macos-page-permission-prompts = ["zephium-app/macos-page-permission-prompts"]

[lib]
name = "zephium_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true
tauri-utils = "2"
serde_json.workspace = true
json-patch = "3"

[dependencies]
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "stream", "system-proxy"] }
tokio = { workspace = true, features = ["time"] }
getrandom = "=0.3.4"
tauri.workspace = true
zephium-core.workspace = true
zephium-ipc.workspace = true
zephium-app.workspace = true
zephium-work-composition = { workspace = true, optional = true }
zephium-engine.workspace = true
zephium-store.workspace = true
zephium-notes.workspace = true
zephium-blocker-service.workspace = true
tauri-plugin-single-instance.workspace = true
window-vibrancy = "=0.8.0"
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri-specta.workspace = true
tauri-plugin-dialog = "2"
base64.workspace = true
zephium-webext = { path = "../crates/zephium-webext", version = "=0.1.0" }

[dev-dependencies]
async-io = "=2.6.0"
futures-lite = "=2.6.1"
tempfile.workspace = true
x11rb = { version = "=0.13.2", features = ["xkb"] }
xkeysym = "=0.2.1"
zbus = { version = "=5.17.0", default-features = false, features = ["async-io"] }

[lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = [
    "cfg(zephium_internal_repository_e2e)",
] }

[target.'cfg(target_os = "windows")'.dependencies]
zephium-blocker = { workspace = true, features = ["runtime"] }
raw-window-handle.workspace = true
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zephium-blocker = { workspace = true, features = ["webkit"] }
gtk = "0.18"
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }

[target.'cfg(target_os = "linux")'.dependencies]
async-io = "=2.6.0"
futures-lite = "=2.6.1"
x11rb = { version = "=0.13.2", features = ["xkb"] }
xkeysym = "=0.2.1"
zbus = { version = "=5.17.0", default-features = false, features = ["async-io"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
zephium-webext-macos = { path = "../crates/zephium-webext-macos", version = "=0.1.0" }
zephium-blocker = { workspace = true, features = ["webkit"] }
block2 = "0.6"
dispatch2 = { version = "0.3.1", default-features = false, features = ["block2", "std"] }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-quartz-core = "0.3"
objc2-web-kit = "0.3"
raw-window-handle.workspace = true
